
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바름이 | 생활체크</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f5;
      color: #263b34;
    }

    header {
      background: #18785c;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; }

    main {
      max-width: 620px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: #18785c;
      color: white;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .tabs button { flex: 1; }
    .tabs button.active { background: #104d3b; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px #183b3010;
    }

    h2 { margin-top: 0; font-size: 21px; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd8d1;
      border-radius: 9px;
      font-size: 16px;
    }

    .full { width: 100%; margin-top: 16px; }

    .hidden { display: none !important; }

    .notice {
      color: #66786f;
      font-size: 13px;
      line-height: 1.6;
    }

    .item {
      padding: 12px 0;
      border-bottom: 1px solid #e6eee9;
      overflow-wrap: anywhere;
    }

    .status {
      color: #18785c;
      font-weight: bold;
      line-height: 1.6;
    }

    .danger { background: #a13d3d; }
    .secondary { background: #65766e; }

    img.preview {
      display: block;
      max-width: 100%;
      max-height: 400px;
      margin-top: 12px;
      border-radius: 10px;
    }

    .item button { margin: 6px 6px 0 0; }
  </style>
</head>

<body>
<header>
  <h1>🌿 바름이</h1>
  <p>우리 학교 생활체크</p>
</header>

<main>
  <div class="tabs">
    <button
      type="button"
      class="active"
      id="studentTab"
      onclick="showPage('student')"
    >학생 화면</button>

    <button
      type="button"
      id="adminTab"
      onclick="showPage('admin')"
    >학생회 관리</button>
  </div>

  <!-- 학생 화면 -->
  <section id="studentPage">
    <div class="card">
      <h2>📝 자가신고 제출</h2>

      <form id="reportForm">
        <label for="studentNumber">학번</label>
        <input
          id="studentNumber"
          type="text"
          inputmode="numeric"
          pattern="[0-9]{5}"
          maxlength="5"
          minlength="5"
          required
          placeholder="숫자 5자리 입력"
          title="학번은 숫자 5자리로 입력해 주세요."
          oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 5)"
        >

        <label for="studentName">이름</label>
        <input
          id="studentName"
          type="text"
          required
          maxlength="30"
          placeholder="이름 입력"
        >

        <button class="full" id="reportSubmit" type="submit">
          자가신고 제출
        </button>
      </form>

      <p id="reportMessage" class="status" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2>📷 사진 제출</h2>

      <label for="photoNumber">학번</label>
      <input
        id="photoNumber"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{5}"
        maxlength="5"
        placeholder="숫자 5자리 입력"
        oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 5)"
      >

      <label for="photoFile">제출할 사진</label>
      <input
        id="photoFile"
        type="file"
        accept="image/*"
      >

      <img
        id="photoPreview"
        class="preview hidden"
        alt="사진 미리보기"
      >

      <button
        type="button"
        class="full"
        id="photoSubmit"
        onclick="submitPhoto()"
      >사진 제출</button>

      <p id="photoMessage" class="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- 학생회 관리 화면 -->
  <section id="adminPage" class="hidden">
    <div class="card" id="loginCard">
      <h2>🔐 학생회 관리자 로그인</h2>

      <form id="loginForm">
        <label for="adminPassword">관리자 비밀번호</label>
        <input
          id="adminPassword"
          type="password"
          required
          placeholder="비밀번호 입력"
        >

        <button class="full" type="submit">로그인</button>
      </form>

      <p id="loginMessage" class="notice" aria-live="polite"></p>
    </div>

    <div id="dashboard" class="hidden">
      <div class="card">
        <h2>📋 자가신고 제출 현황</h2>
        <div id="reportList"></div>
      </div>

      <div class="card">
        <h2>📋 사진 미제출자 명단</h2>
        <p class="notice">
          자가신고를 제출했지만 사진을 제출하지 않은 학생입니다.
        </p>
        <div id="missingPhotoList"></div>
      </div>

      <div class="card">
        <h2>📷 사진 검토</h2>
        <div id="photoList"></div>
      </div>

      <button
        type="button"
        class="danger full"
        onclick="logout()"
      >로그아웃</button>
    </div>
  </section>

  <p class="notice">
    현재는 이 브라우저에 저장되는 시제품입니다.
    다른 기기와 자료가 공유되지 않으며, 실제 개인정보 관리용 보안 기능은 제공하지 않습니다.
  </p>
</main>

<script>
  // 시제품 전용 설정입니다.
  // 이 비밀번호는 실제 보안 기능이 아닙니다.
  const ADMIN_PASSWORD = "1234";
  const REPORT_KEY = "bareumi_reports";
  const PHOTO_KEY = "bareumi_photos";
  const MAX_PHOTO_SIZE = 700 * 1024;

  let reports = loadData(REPORT_KEY);
  let photos = loadData(PHOTO_KEY);
  let loggedIn = false;

  function loadData(key) {
    try {
      const value = JSON.parse(localStorage.getItem(key) || "[]");
      return Array.isArray(value) ? value : [];
    } catch (error) {
      console.error("저장된 자료를 읽지 못했습니다.", error);
      return [];
    }
  }

  function saveData() {
    // 두 목록을 저장합니다. 저장 실패 시 오류를 호출한 곳으로 전달합니다.
    localStorage.setItem(REPORT_KEY, JSON.stringify(reports));
    localStorage.setItem(PHOTO_KEY, JSON.stringify(photos));
  }

  function showPage(page) {
    const isStudent = page === "student";

    document.getElementById("studentPage")
      .classList.toggle("hidden", !isStudent);

    document.getElementById("adminPage")
      .classList.toggle("hidden", isStudent);

    document.getElementById("studentTab")
      .classList.toggle("active", isStudent);

    document.getElementById("adminTab")
      .classList.toggle("active", !isStudent);
  }

  // 자가신고 제출
  document.getElementById("reportForm")
    .addEventListener("submit", function(event) {
      event.preventDefault();

      const number = document.getElementById("studentNumber")
        .value.trim();

      const name = document.getElementById("studentName")
        .value.trim();

      const message = document.getElementById("reportMessage");
      const submitButton = document.getElementById("reportSubmit");

      if (!/^[0-9]{5}$/.test(number)) {
        message.textContent = "학번 5자리를 정확히 입력해 주세요.";
        return;
      }

      if (!name) {
        message.textContent = "이름을 입력해 주세요.";
        return;
      }

      const previousReports = reports.slice();

      // 같은 학번의 재제출은 기존 기록을 갱신합니다.
      reports = reports.filter(item => item.number !== number);
      reports.push({
        number: number,
        name: name,
        date: new Date().toLocaleString("ko-KR")
      });

      submitButton.disabled = true;

      try {
        saveData();

        message.textContent =
          number + " " + name + " 학생, 자가신고 제출이 완료되었습니다.";

        this.reset();

        if (loggedIn) renderLists();
      } catch (error) {
        reports = previousReports;

        message.textContent =
          "저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.";

        console.error("자가신고 저장 오류:", error);
      } finally {
        submitButton.disabled = false;
      }
    });

  // 사진 미리보기
  document.getElementById("photoFile")
    .addEventListener("change", function() {
      const file = this.files[0];
      const preview = document.getElementById("photoPreview");
      const message = document.getElementById("photoMessage");

      message.textContent = "";

      if (!file) {
        preview.removeAttribute("src");
        preview.classList.add("hidden");
        return;
      }

      if (!file.type.startsWith("image/")) {
        message.textContent = "이미지 파일을 선택해 주세요.";
        this.value = "";
        preview.removeAttribute("src");
        preview.classList.add("hidden");
        return;
      }

      if (file.size > MAX_PHOTO_SIZE) {
        message.textContent = "사진은 700KB 이하 파일을 선택해 주세요.";
        this.value = "";
        preview.removeAttribute("src");
        preview.classList.add("hidden");
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.classList.remove("hidden");
    });

  // 사진 제출
  function submitPhoto() {
    const number = document.getElementById("photoNumber")
      .value.trim();

    const fileInput = document.getElementById("photoFile");
    const file = fileInput.files[0];

    const message = document.getElementById("photoMessage");
    const submitButton = document.getElementById("photoSubmit");

    if (!/^[0-9]{5}$/.test(number)) {
      message.textContent = "학번 5자리를 정확히 입력해 주세요.";
      return;
    }

    if (!file) {
      message.textContent = "제출할 사진을 선택해 주세요.";
      return;
    }

    if (!file.type.startsWith("image/")) {
      message.textContent = "이미지 파일만 제출할 수 있습니다.";
      return;
    }

    if (file.size > MAX_PHOTO_SIZE) {
      message.textContent = "사진은 700KB 이하 파일을 선택해 주세요.";
      return;
    }

    submitButton.disabled = true;
    message.textContent = "사진을 저장하고 있습니다.";

    const reader = new FileReader();

    reader.onerror = function() {
      message.textContent = "사진을 읽지 못했습니다. 다시 시도해 주세요.";
      submitButton.disabled = false;
    };

    reader.onload = function() {
      const previousPhotos = photos.slice();

      photos = photos.filter(item => item.number !== number);

      photos.push({
        number: number,
        image: reader.result,
        status: "검토 대기",
        date: new Date().toLocaleString("ko-KR"),
        timestamp: Date.now()
      });

      try {
        saveData();

        message.textContent = "사진 제출이 완료되었습니다.";

        fileInput.value = "";
        document.getElementById("photoNumber").value = "";

        const preview = document.getElementById("photoPreview");
        preview.removeAttribute("src");
        preview.classList.add("hidden");

        if (loggedIn) renderLists();
      } catch (error) {
        photos = previousPhotos;

        message.textContent =
          "사진 저장에 실패했습니다. 브라우저 저장 공간이 부족할 수 있습니다.";

        console.error("사진 저장 오류:", error);
      } finally {
        submitButton.disabled = false;
      }
    };

    reader.readAsDataURL(file);
  }

  // 관리자 로그인
  document.getElementById("loginForm")
    .addEventListener("submit", function(event) {
      event.preventDefault();
      login();
    });

  function login() {
    const password = document.getElementById("adminPassword").value;
    const loginMessage = document.getElementById("loginMessage");

    if (password !== ADMIN_PASSWORD) {
      loggedIn = false;
      loginMessage.textContent = "비밀번호가 올바르지 않습니다.";
      return;
    }

    loggedIn = true;

    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    loginMessage.textContent = "";
    renderLists();
  }

  function logout() {
    loggedIn = false;

    document.getElementById("loginCard").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("adminPassword").value = "";
    document.getElementById("loginMessage").textContent = "";

    showPage("admin");
  }

  // 목록에 텍스트를 안전하게 추가합니다.
  function addText(parent, text) {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = text;
    parent.appendChild(div);
  }

  // 관리자 목록 갱신
  function renderLists() {
    if (!loggedIn) return;

    const reportList = document.getElementById("reportList");
    const photoList = document.getElementById("photoList");
    const missingPhotoList = document.getElementById("missingPhotoList");

    if (!reportList || !photoList || !missingPhotoList) {
      console.error("관리자 목록 HTML 요소를 찾을 수 없습니다.");
      return;
    }

    reportList.replaceChildren();
    photoList.replaceChildren();
    missingPhotoList.replaceChildren();

    // 자가신고 제출 현황
    if (reports.length === 0) {
      addText(reportList, "아직 제출한 학생이 없습니다.");
    } else {
      reports.forEach(item => {
        addText(
          reportList,
          item.number + " · " + item.name +
          " · 제출 완료 · " + item.date
        );
      });
    }

    // 사진을 제출한 학생의 학번
    const photoNumbers = new Set(
      photos.map(item => String(item.number).trim())
    );

    // 자가신고는 했지만 사진을 제출하지 않은 학생
    const missingStudents = reports.filter(
      item => !photoNumbers.has(String(item.number).trim())
    );

    if (missingStudents.length === 0) {
      addText(missingPhotoList, "사진 미제출자가 없습니다.");
    } else {
      missingStudents.forEach(item => {
        addText(
          missingPhotoList,
          item.number + " · " + item.name + " · 사진 미제출"
        );
      });
    }

    // 사진 검토 목록: 최근 제출 사진부터 표시
    if (photos.length === 0) {
      addText(photoList, "검토할 사진이 없습니다.");
    }

    [...photos]
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
      .forEach(item => {
        const index = photos.indexOf(item);

        const div = document.createElement("div");
        div.className = "item";

        const title = document.createElement("p");
        title.textContent =
          item.number + " · " + item.status + " · " + item.date;

        div.appendChild(title);

        const img = document.createElement("img");
        img.src = item.image;
        img.alt = "제출된 사진";
        img.className = "preview";

        div.appendChild(img);

        if (item.status === "검토 대기") {
          const accept = document.createElement("button");
          accept.type = "button";
          accept.textContent = "수락";

          accept.onclick = function() {
            const previousStatus = photos[index].status;
            photos[index].status = "제출 완료";

            try {
              saveData();
              renderLists();
            } catch (error) {
              photos[index].status = previousStatus;

              alert(
                "변경 사항을 저장하지 못했습니다. 다시 시도해 주세요."
              );

              console.error("사진 승인 저장 오류:", error);
            }
          };

          div.appendChild(accept);
        }

        photoList.appendChild(div);
      });
  }
</script>
</body>
</html>
